@if (showSplash()) {

  <!-- =======================================================
       SPLASH SCREEN
  ======================================================== -->

  <div class="splash-screen">

    <div class="splash-content">

      <!-- BRAND / PLANE ORBIT -->
      <div class="brand-orbit">

        <div class="brand-orbit-track">
          <i class="fa-solid fa-plane"></i>
        </div>

        <div class="brand-glow"></div>

        <div class="brand-name">
          <span class="brand-main">Hamza</span>
          <span class="brand-highlight">Travels</span>
        </div>

      </div>


      <!-- TAGLINE -->

      <p class="splash-tagline">
        Your Journey, Our Responsibility
      </p>


      <!-- SERVICES -->

      <div class="splash-services">

        <span>
          <i class="fa-solid fa-plane"></i>
          Flight Booking
        </span>

        <span>
          <i class="fa-solid fa-train"></i>
          Train Booking
        </span>

        <span>
          <i class="fa-solid fa-hotel"></i>
          Hotel Booking
        </span>

        <span>
          <i class="fa-solid fa-passport"></i>
          Visa Services
        </span>

      </div>


      <!-- LOADING BAR -->

      <div class="splash-loader">
        <span></span>
      </div>

    </div>

  </div>

}


<!-- =========================================================
     MAIN WEBSITE
========================================================= -->

@if (i18n.ready()) {

  <app-navbar></app-navbar>

  <router-outlet></router-outlet>

  <app-footer></app-footer>

}

      stroke-width="2"
    />

    <circle
      cx="12"
      cy="12"
      r="4"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    />

      cx="17.5"
