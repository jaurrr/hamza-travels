<section class="service-details-page">

  <div class="service-details-container">

    <a routerLink="/services" class="back-link">
      ← Back to Services
    </a>

    <div *ngIf="service; else serviceNotFound">

      <div class="service-details-heading">

        <span>{{ service.category }}</span>

        <h1>{{ service.name }}</h1>

        <p>
          {{ service.description }}
        </p>

      </div>

      <div class="service-details-grid">

        <!-- INFORMATION -->
        <div class="service-info-card">

          <h2>Required Documents</h2>

          <ul>
            <li *ngFor="let requirement of service.requirements">
              {{ requirement }}
            </li>
          </ul>

        </div>

        <!-- ACTION -->
        <div class="service-action-card">

          <h2>Service Charges</h2>

          <p>
            {{ service.charge }}
          </p>

       <a [routerLink]="['/apply',service.id]" class="apply-button"> Apply Now</a>


        </div>

      </div>

    </div>

    <ng-template #serviceNotFound>

      <div class="not-found">

        <h2>Service Not Found</h2>

        <p>
          The service you are looking for does not exist.
        </p>

        <a routerLink="/services">
          View All Services
        </a>

      </div>

    </ng-template>

  </div>

</section>
