<nav class="navbar">

  <div class="navbar-container">

    <!-- Logo -->
    <a
      routerLink="/"
      class="logo"
      (click)="closeMenu()">

      <img
        src="/images/hamza-travels-logo.png"
        alt="Hamza Travels Logo"
        class="logo-image"
      />

      <span>Hamza Travels</span>

    </a>


    <!-- Global Search -->
    <div class="service-search">

      <div class="search-box">

        <span class="search-icon">⌕</span>

        <input
          type="text"
          [placeholder]="'nav.searchPlaceholder' | translate"
          [value]="searchText"
          (input)="searchText = $any($event.target).value"
          [attr.aria-label]="'nav.searchAria' | translate"
        />

        <button
          type="button"
          class="voice-search"
          [class.listening]="isListening"
          (click)="startVoiceSearch()"
          [attr.aria-label]="'nav.voiceAria' | translate">
          <i class="fa-solid fa-microphone"></i>
        </button>

        <button
          *ngIf="searchText"
          type="button"
          class="clear-search"
          (click)="clearSearch()"
          [attr.aria-label]="'nav.clearSearch' | translate">
          ×
        </button>

      </div>


      <!-- Voice error (replaces the old raw alert) -->
      <div
        class="voice-error"
        *ngIf="voiceError"
        role="alert">

        <i class="fa-solid fa-triangle-exclamation"></i>
        {{ voiceError }}

      </div>


      <!-- Search Results -->
      <div
        class="search-results"
        *ngIf="searchText.trim()">

        <button
          *ngFor="let service of searchResults"
          type="button"
          class="search-result"
          (click)="openService(service)">

          <div class="search-result-content">

            <strong>
              {{ translationService.serviceName(service.id, service.name) }}
            </strong>

            <span>
              {{ translationService.serviceCategory(service.category) }}
            </span>

          </div>

          <span class="search-arrow">→</span>

        </button>


        <!-- No Result -->
        <div
          class="no-results"
          *ngIf="searchResults.length === 0">

          {{ 'nav.noResults' | translate }}

        </div>

      </div>

    </div>


    <!-- Language Toggle -->
<button
  type="button"
  class="theme-toggle lang-toggle"
  (click)="translationService.setLang(translationService.lang() === 'hi' ? 'en' : 'hi')"
  [attr.aria-label]="'nav.langToggle' | translate"
  [attr.title]="'nav.langToggle' | translate">

  <span class="lang-letter">
    {{ translationService.lang() === 'hi' ? 'अ' : 'A' }}
  </span>

</button>



    <!-- Dark Mode Button -->
    <button
      type="button"
      class="theme-toggle"
      (click)="toggleTheme()"
      [attr.aria-label]="(isDarkMode ? 'nav.themeLight' : 'nav.themeDark') | translate"
      [attr.title]="(isDarkMode ? 'nav.themeLight' : 'nav.themeDark') | translate">

      <i
        class="fa-solid"
        [class.fa-moon]="!isDarkMode"
        [class.fa-sun]="isDarkMode">
      </i>

    </button>


    <!-- Mobile Menu Button -->
    <button
      type="button"
      class="menu-button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen"
      [attr.aria-label]="'nav.menuToggle' | translate">

      <span></span>
      <span></span>
      <span></span>

    </button>


    <!-- Navigation Links -->
    <div
      class="nav-links"
      [class.menu-open]="menuOpen">

      <a
        routerLink="/"
        [class.active]="navActive('home')"
        (click)="goTo($event, 'home', '/')">
        {{ 'nav.home' | translate }}
      </a>

      <a
        routerLink="/services"
        [class.active]="navActive('services')"
        (click)="goTo($event, 'services', '/services')">
        {{ 'nav.services' | translate }}
      </a>

      <a
        routerLink="/about"
        [class.active]="navActive('about')"
        (click)="goTo($event, 'about', '/about')">
        {{ 'nav.about' | translate }}
      </a>

      <a
        routerLink="/explore"
        [class.active]="navActive('explore')"
        (click)="goTo($event, 'explore', '/explore')">
        {{ 'nav.explore' | translate }}
      </a>

      <a
        routerLink="/contact"
        [class.active]="navActive('contact')"
        (click)="goTo($event, 'contact', '/contact')">
        {{ 'nav.contact' | translate }}
      </a>

    </div>

  </div>

</nav>
